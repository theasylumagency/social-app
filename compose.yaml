name: unda-social-operator

services:
  database:
    image: postgres:18.4
    container_name: unda-social-postgres
    restart: unless-stopped
    env_file:
      - .env.local
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - unda_social_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  unda_social_postgres_data:
